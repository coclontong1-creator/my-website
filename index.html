
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f4f7;
            padding: 60px 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #16834a; }
        button {
            background: #16834a;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>
        <p>Ini adalah website pertama saya.</p>
        <button onclick="alert('Hello World!')">
            Click Here
        </button>
    </div>
</body>
</html>
